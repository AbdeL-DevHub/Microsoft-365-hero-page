<!DOCTYPE html>
<html lang="en"> 
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Microsoft 365 Hero Page Recreation" />
    <meta property="og:description" content="A recreation of the Microsoft 365 landing page hero section, built with HTML and CSS to practice flexbox and inline icons." />
    <meta property="og:image" content="https://abdel-devhub.github.io/Microsoft-365-hero-page/thumbnail.png" />
    <meta property="og:url" content="https://abdel-devhub.github.io/Microsoft-365-hero-page/" />
    <title>Microsoft Heading Page</title>
    <link rel="stylesheet" href="style.css"/>
    <link rel="stylesheet" href="icons.css"/>
    <script src="https://kit.fontawesome.com/6663771fe1.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <header>
        <div class="container">
            <div class="navbar">
              <div class="nav-left">
                <ul class="nav left">
                    <li class="logo"><span class="logos--microsoft-icon micro-logo"></span>Microsoft</li>
                    <li>Microsoft 365</li>
                    <li>Products<i class="fa-solid fa-angle-down dropdown-icon"></i></li>
                    <li>Features<i class="fa-solid fa-angle-down dropdown-icon"></i></li>
                    <li>Download<i class="fa-solid fa-angle-down dropdown-icon"></i></li>
                    <li>Support<i class="fa-solid fa-angle-down dropdown-icon"></i></li>
                    <li>Buy Microsoft 365</li>
                </ul>
              </div>
              <div class="nav-right">
                <ul class="nav right">
                    <li>All Microsoft<i class="fa-solid fa-angle-down dropdown-icon"></i>
                    <li>Sign in</li>
                    <span class="pepicons-pencil--person-plus-circle"></span>
                </ul>
              </div>
            </div>
        
          <div class="container-sm-hero">
            <div class="heading-text">
                <h1><span class="italics-text">Work smarter </span>across Microsoft 365 
                  <span class="selfhst--microsoft-word"></span>
                  <span class="selfhst--microsoft-excel"></span><span class="selfhst--microsoft-powerpoint"></span class="other-three">with</span>
                  <span class="selfhst--microsoft-copilot"></span><span class="copilot">Copilot</span></h1>
                <p>Sign in to create, collaborate, and move your work forward with Copilot in Microsoft 365.</p>
            </div>
            <div class="cta">
                <button class="sign-in-btn">Sign in</button>
                <button class="buy-btn">Buy Microsoft 365</button>
            </div>
          </div>
        </div>
    </header>
    <main>
      <h2>Popular prompts to try</h2>
    </main>
  </body>
